interface:
  display_name: "Luma Event Interest to Use Case Mapping"
  short_description: "Map Luma interests to showcase workflows"
  default_prompt: "Use $luma-event-interest-to-use-case-mapping to rank the top ten interests from a live Luma event, match them to official ChatGPT and Codex use cases, and design event-tailored showcase workflows."
dependencies:
  tools:
    - type: "mcp"
      value: "codex_apps"
      description: "Connected Luma app for events and registration answers"
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "Official OpenAI documentation search and retrieval"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"
policy:
  allow_implicit_invocation: true
